name: Yokai Hub Signed APK Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile & Sign YOKAI HUB APK (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Yokai Hub Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Pre-installed Android SDK (API 35)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null \vert{}\vert{} true$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o gradle.zip
          unzip -q gradle.zip -d /tmp
          echo "/tmp/gradle-8.10.2/bin" >> $GITHUB_PATH

      - name: Generate Keystore & Compile Release APK
        run: |
          mkdir -p app/release
          rm -f app/release/yokaihub-release.jks
          keytool -genkeypair -v \
            -keystore app/release/yokaihub-release.jks \
            -alias yokaihub \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass yokaihub2026 -keypass yokaihub2026 \
            -dname "CN=YokaiHub, OU=Mobile, O=Kingerald, L=Tokyo, S=Tokyo, C=JP"

          export KEYSTORE_PATH="$PWD/app/release/yokaihub-release.jks"
          export KEYSTORE_FILE="$KEYSTORE_PATH"
          export KEYSTORE_PASSWORD="yokaihub2026"
          export KEY_ALIAS="yokaihub"
          export KEY_PASSWORD="yokaihub2026"

          set +e
          gradle assembleRelease --no-daemon --stacktrace > build.log 2>&1
          EXIT_CODE=$?
          cat build.log

          if [ $EXIT_CODE -ne 0 ]; then
            echo "### ❌ Gradle Compilation Error Details" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E "e: |FAILURE:|What went wrong:|>\s|AAPT:|error:" -A 5 build.log | tail -n 80 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          fi
          set -e

          BUILT_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          $BUILD_TOOLS/zipalign -v -f -p 4 "$BUILT_APK" app/build/outputs/apk/release/YokaiHub-aligned.apk
          $BUILD_TOOLS/apksigner sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out app/build/outputs/apk/release/YokaiHub-v1.0.0-Signed.apk \
            app/build/outputs/apk/release/YokaiHub-aligned.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YokaiHub-Signed-APK
          path: app/build/outputs/apk/release/YokaiHub-v1.0.0-Signed.apk

      - name: Publish Signed APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" \
            app/build/outputs/apk/release/YokaiHub-v1.0.0-Signed.apk \
            --title "YOKAI HUB $TAG (Signed Production APK)" \
            --notes "Automated V1+V2+V3 Signed APK build for YOKAI HUB (com.yokaihub.agent)." \
            --clobber
